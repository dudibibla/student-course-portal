<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Cart - Student Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">StudentPortal</a>
        <div class="navbar-nav">
            <a href="/catalog" class="nav-link">Catalog</a>
            <a href="/cart" class="nav-link">Cart (<span th:text="${cart.size()}"></span>)</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <button id="theme-toggle" class="theme-toggle">🌙</button>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger" style="padding: 0.5rem 1rem;">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <h1 style="color: var(--primary-color);">Your Registration Cart</h1>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${cart.empty}" class="alert alert-danger mt-2">
            Your cart is empty. Go to the <a href="/catalog" style="color: var(--primary-color);">catalog</a> to add courses.
        </div>

        <div th:if="${!cart.empty}">
            <table style="width: 100%; border-collapse: collapse; margin-top: 1.5rem; background-color: var(--card-bg); border-radius: 8px; box-shadow: var(--shadow);">
                <thead>
                    <tr style="background-color: var(--primary-color); color: white;">
                        <th style="padding: 1rem; text-align: left;">Course Name</th>
                        <th style="padding: 1rem; text-align: left;">Teacher</th>
                        <th style="padding: 1rem; text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${cart}" style="border-bottom: 1px solid var(--border-color);">
                        <td style="padding: 1rem;" th:text="${course.name}">Course Name</td>
                        <td style="padding: 1rem;" th:text="${course.teacher.name}">Teacher</td>
                        <td style="padding: 1rem; text-align: right;">
                            <form th:action="@{/cart/remove}" method="post">
                                <input type="hidden" name="courseId" th:value="${course.id}">
                                <button type="submit" class="btn btn-danger" style="padding: 0.5rem 1rem;">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="mt-2 text-center">
                <form th:action="@{/cart/checkout}" method="post">
                    <button type="submit" class="btn btn-success" style="font-size: 1.1rem; padding: 1rem 2rem;">Confirm Registration</button>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
