<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">StudentPortal</a>
        <div class="navbar-nav">
            <a href="/login" class="nav-link">Login</a>
            <button id="theme-toggle" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
        <div class="card" style="width: 100%; max-width: 450px;">
            <h2 class="text-center mb-2" style="color: var(--primary-color);">Create an Account</h2>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required placeholder="John Doe">
                    <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required placeholder="student@example.com">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required minlength="6" placeholder="At least 6 characters">
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <p class="text-muted-note">New accounts are created as students. Teacher accounts are assigned by the administrator.</p>

                <div class="form-group text-center">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
                </div>
            </form>
            
            <div class="text-center mt-2">
                <p>Already have an account? <a href="/login" style="color: var(--primary-color);">Log in here</a></p>
            </div>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
