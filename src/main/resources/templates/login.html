<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">StudentPortal</a>
        <div class="navbar-nav">
            <a href="/register" class="nav-link">Register</a>
            <button id="theme-toggle" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h2 class="text-center mb-2" style="color: var(--primary-color);">Welcome Back</h2>
            
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username and password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out.
            </div>
            <div th:if="${param.registered}" class="alert alert-success">
                Registration successful! Please log in.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Email</label>
                    <input type="email" id="username" name="username" class="form-control" required autofocus placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
                </div>
                <div class="form-group text-center">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
                </div>
            </form>
            
            <div class="text-center mt-2">
                <p>Don't have an account? <a href="/register" style="color: var(--primary-color);">Register here</a></p>
            </div>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
